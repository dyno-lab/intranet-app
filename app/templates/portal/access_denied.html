<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso no habilitado | Centros Sor Isolina Ferré</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ request.url_for('static', path='css/ui-modern.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 720px;">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5 text-center">
        <i class="bi bi-shield-lock text-warning display-4" aria-hidden="true"></i>
        <h1 class="h3 mt-3">No tiene acceso habilitado.</h1>
        <p class="text-muted mb-4">Comuníquese con <a href="mailto:cramirez@csifpr.org">cramirez@csifpr.org</a></p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          {% if can_manage_platform_settings %}
          <a class="btn btn-primary" href="/platform/settings">Configuración de plataforma</a>
          {% endif %}
          <form method="post" action="/logout">
            <button class="btn btn-outline-secondary" type="submit">Cerrar sesión</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
