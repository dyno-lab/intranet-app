<link href="/static/css/farogpt.css?v=2" rel="stylesheet">
<div class="farogpt" data-farogpt hidden>
  <section class="farogpt__panel" id="farogpt-chat" role="dialog" aria-modal="false" aria-labelledby="farogpt-title" hidden>
    <header class="farogpt__header">
      <img src="/static/img/farogpt-mascot.png" alt="" width="48" height="48" class="farogpt__avatar">
      <div class="farogpt__heading"><h2 id="farogpt-title">FaroGPT</h2><p>Asistente de FARO</p></div>
      <button type="button" class="farogpt__control" data-fg-minimize aria-label="Minimizar FaroGPT" title="Minimizar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" class="farogpt__control" data-fg-close aria-label="Cerrar FaroGPT" title="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>
    <div class="farogpt__body" data-fg-body>
      <div class="farogpt__badge"><span aria-hidden="true"></span>Consulta de datos del programa</div>
      <div class="farogpt__messages" data-fg-messages role="log" aria-label="Conversación con FaroGPT" aria-live="polite" aria-relevant="additions"></div>
      <div class="farogpt__suggestions" data-fg-suggestions aria-label="Preguntas sugeridas"></div>
    </div>
    <footer class="farogpt__footer">
      <form class="farogpt__composer" data-fg-form>
        <label class="farogpt__sr-only" for="farogpt-question">Tu pregunta para FaroGPT</label>
        <input id="farogpt-question" name="question" type="text" placeholder="Escribe tu pregunta…" autocomplete="off" maxlength="800" required data-fg-input>
        <button type="submit" class="farogpt__send" aria-label="Enviar pregunta" data-fg-send><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 3 17 9-17 9 4-9-4-9Zm4 9h13"/></svg></button>
      </form>
      <p>Consultas según tus permisos</p>
    </footer>
  </section>
  <div class="farogpt__dock">
    <button type="button" class="farogpt__invitation" data-fg-invitation aria-controls="farogpt-chat">¿Qué quieres consultar hoy?</button>
    <button type="button" class="farogpt__launcher" data-fg-launcher aria-label="Abrir FaroGPT" aria-haspopup="dialog" aria-controls="farogpt-chat" aria-expanded="false">
      <img src="/static/img/farogpt-mascot.png" alt="" width="112" height="112" decoding="async">
      <span>FaroGPT</span>
    </button>
  </div>
</div>
<script src="/static/js/farogpt.js?v=5" defer></script>
