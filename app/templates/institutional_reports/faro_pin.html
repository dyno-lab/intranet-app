<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso al Reporte Institucional | Faro de Esperanza</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ request.url_for('static', path='css/ui-modern.css') }}" rel="stylesheet">
</head>
<body class="institutional-report-body">
  <main class="institutional-report-pin">
    <section class="institutional-report-pin__card" aria-labelledby="faro-pin-title">
      <div class="institutional-report-pin__brand">
        <img
          class="institutional-report-pin__logo"
          src="{{ request.url_for('static', path='img/logo-faro-esperanza.png') }}"
          alt="Logo Faro de Esperanza"
        >
        <span class="institutional-report__eyebrow">Acceso protegido</span>
        <h1 id="faro-pin-title" class="institutional-report-pin__title">Reporte Institucional</h1>
        <p class="institutional-report-pin__subtitle">Faro de Esperanza</p>
      </div>

      <div class="institutional-report-pin__content">
        <p class="institutional-report-pin__copy">
          Ingrese el PIN autorizado para consultar el reporte agregado.
        </p>

        {% if error %}
        <div class="institutional-report-alert institutional-report-alert--error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form
          class="institutional-report-pin__form"
          method="post"
          action="/reporteinstitucionales/farodeesperanza/pin"
          autocomplete="off"
        >
          <div>
            <label class="institutional-report-pin__label" for="institutional-report-pin-input">
              PIN de acceso
            </label>
            <input
              class="institutional-report-pin__input"
              id="institutional-report-pin-input"
              name="pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              autocomplete="off"
              aria-describedby="institutional-report-pin-help"
              required
              {% if configuration_error %}disabled{% endif %}
            >
            <p id="institutional-report-pin-help" class="institutional-report-pin__help">
              El acceso se cerrará después de 30 minutos de inactividad.
            </p>
          </div>

          <button
            class="institutional-report-button institutional-report-button--primary"
            type="submit"
            {% if configuration_error %}disabled{% endif %}
          >
            <i class="bi bi-shield-lock" aria-hidden="true"></i>
            <span>Acceder al reporte</span>
          </button>
        </form>

        <a class="institutional-report-pin__back" href="/reporteinstitucionales">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          <span>Regresar a Reportes Institucionales</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
