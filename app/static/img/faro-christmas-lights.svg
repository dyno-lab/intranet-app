      <use href="#glass-shape" fill="currentColor"/>
      <use href="#glass-shape" fill="url(#glass)"/>
      <use href="#glass-shape" fill="url(#lit-core)"/>
      <path d="M-1.7 10.5-.8 15.5 1.3 12.5.4 20" fill="none" stroke="#fffce5" stroke-width="1.2" stroke-linecap="round" filter="url(#filament)"/>
      <path d="M-3.2 10.5Q-5.3 13-3.9 16" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M2.7 18.5 0 22" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".7"/>
      <rect x="-3.8" y="-.5" width="7.6" height="9" rx="1.4" fill="url(#socket)"/>
      <path d="M-3.2 2H3.2M-3.2 4.2H3.2M-3.2 6.4H3.2" stroke="#0d2919" stroke-opacity=".6" stroke-width=".65"/>
      <path d="M-2.3.7V7" stroke="#afc49a" stroke-opacity=".35" stroke-width=".7"/>
