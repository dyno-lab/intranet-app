<svg xmlns="http://www.w3.org/2000/svg" width="640" height="60" viewBox="0 0 640 60">
  <defs>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="filament" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <linearGradient id="socket" x1="0" x2="1">
      <stop stop-color="#152e20"/>
      <stop offset=".35" stop-color="#526b47"/>
      <stop offset=".65" stop-color="#294630"/>
      <stop offset="1" stop-color="#11271b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop stop-color="#14251b" stop-opacity=".35"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#131b15" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="lit-core" cx="45%" cy="35%" r="65%">
      <stop stop-color="#fffdeb"/>
      <stop offset=".25" stop-color="#fffbe2" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <path id="glass-shape" d="M-4 8 C-9 13-7 18 0 26 C7 18 9 13 4 8Z"/>
    <g id="bulb">
